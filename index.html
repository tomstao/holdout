<!doctype html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="holdout">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Holdout</title>
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives.
      Each value mirrors --color-background in src/themes.css (holdout,
      paper) or src/styles.css (slate); keep them in sync.
    -->
    <style>
      html {
        background-color: #f5f1e8;
        color-scheme: light;
      }
      html[data-theme='slate'] {
        background-color: #0a0a0a;
        color-scheme: dark;
      }
      html[data-theme='paper'] {
        background-color: #ffffff;
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
